<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Web Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 2rem;
            text-align: center;
        }

        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 1rem;
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .reg-no {
            color: #667eea;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        h2 {
            color: #555;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #667eea;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .members-list {
            list-style: none;
            margin: 1rem 0;
        }

        .members-list li {
            background: #f3f4f6;
            margin: 0.5rem 0;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .members-list li:hover {
            transform: translateX(5px);
            background: #e5e7eb;
        }

        .info-box {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Recent Picture -->
        <img src="tayyabakhtar.png" alt="My Recent Picture" class="profile-img">
        
        <!-- Name -->
        <h1>TAYYAB AKHTAR</h1>
        
        <!-- Registration Number -->
        <div class="reg-no">Registration No: 4986-FOC/BSCS/F23</div>
        
        <!-- List of Group Members -->
        <h2> Group Members</h2>
        <ul class="members-list">
            <li>TAYYAB AKHTAR</li>
            <li>HARIS BIN HABIB</li>
            <li>TABISH AHMAD</li>
        </ul>
        
        <div class="info-box">
            <p>Built with HTML & CSS | Hosted on GitHub Pages | 2026</p>
        </div>
    </div>
</body>
</html>
